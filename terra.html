<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#02040b">
  <title>Terra 3D — Hackathon</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #7fd6ff;
      --text: #eef2ff;
      --muted: #9aa6c7;
      --line: rgba(238, 242, 255, .14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040b;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      display: block;
    }

    #scene.dragging {
      cursor: grabbing;
    }

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      pointer-events: none;
    }

    .bar>* {
      pointer-events: auto;
    }

    .back {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(14, 20, 40, .8);
      backdrop-filter: blur(10px);
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
    }

    .back:hover {
      border-color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -.02em;
    }

    h1 span {
      color: var(--accent);
    }

    .panel {
      position: fixed;
      z-index: 2;
      left: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(14, 20, 40, .82);
      backdrop-filter: blur(10px);
      font-size: 12px;
      color: var(--muted);
      max-width: calc(100% - 40px);
    }

    .panel ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 4px;
    }

    .panel b {
      color: var(--text);
      font-weight: 650;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      min-width: 40px;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    #info {
      position: fixed;
      z-index: 2;
      top: 64px;
      left: 20px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(14, 20, 40, .82);
      font-size: 12px;
      color: var(--muted);
      max-width: calc(100% - 40px);
    }

    #info strong {
      display: block;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 2px;
    }

    html.embedded .bar {
      display: none;
    }

    html.embedded #info {
      top: 20px;
    }

    @media (max-width: 640px) {
      .panel ul {
        display: none;
      }

      .panel {
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
  <script>
    if (new URLSearchParams(window.location.search).has("embed")) document.documentElement.classList.add("embedded");
  </script>
</head>

<body>
  <canvas id="scene" aria-label="Visualizador 3D da Terra"></canvas>
  <header class="bar">
    <a class="back" href="index.html">← Voltar</a>
    <h1>TERRA<span>.</span>3D</h1>
    <span></span>
  </header>
  <div class="panel">
    <ul>
      <li><b>Arraste</b> para girar a Terra</li>
      <li><b>Scroll</b> (ou pinça no celular) para zoom</li>
      <li><b>Duplo clique</b> para redefinir</li>
    </ul>
    <div class="row">
      <button id="zin" type="button" aria-label="Aproximar">＋</button>
      <button id="zout" type="button" aria-label="Afastar">－</button>
      <button id="spin" type="button">Rotação: ligada</button>
      <button id="reset" type="button">Redefinir</button>
    </div>
    <div class="row" role="group" aria-label="Resolução">
      <button type="button" class="res" data-res="low">Baixa</button>
      <button type="button" class="res" data-res="high">Alta</button>
    </div>
  </div>
  <div id="info"><strong>Planeta Terra</strong><span id="resinfo">Continentes simplificados</span></div>
  <script>
    (function () {
      var canvas = document.getElementById("scene");
      var ctx = canvas.getContext("2d");
      var D = Math.PI / 180;

      // Continentes simplificados: pares [longitude, latitude]
      var LAND = [
        [[-168, 66], [-156, 71], [-125, 70], [-95, 72], [-80, 69], [-62, 60], [-56, 52], [-66, 45], [-70, 42], [-76, 35], [-81, 30], [-80, 25], [-83, 29], [-90, 29], [-97, 26], [-97, 20], [-91, 18], [-87, 21], [-88, 16], [-83, 10], [-78, 8], [-82, 8], [-86, 12], [-93, 15], [-105, 20], [-110, 24], [-113, 31], [-117, 32], [-121, 35], [-124, 42], [-124, 48], [-135, 58], [-150, 60], [-165, 55], [-158, 58], [-166, 62]],
        [[-78, 8], [-72, 12], [-62, 10], [-52, 5], [-50, 0], [-35, -6], [-39, -14], [-41, -22], [-48, -26], [-54, -34], [-58, -38], [-65, -41], [-66, -47], [-69, -52], [-74, -52], [-73, -40], [-71, -30], [-70, -18], [-76, -14], [-81, -5], [-80, 0], [-77, 4]],
        [[-73, 60], [-60, 82], [-30, 83], [-20, 76], [-22, 70], [-40, 62], [-50, 64], [-55, 70], [-68, 76]],
        [[-10, 36], [-9, 43], [-2, 44], [-4, 48], [2, 51], [8, 54], [10, 58], [18, 60], [22, 66], [30, 70], [40, 67], [60, 69], [80, 73], [105, 77], [140, 72], [170, 70], [180, 66], [160, 60], [155, 51], [142, 53], [140, 46], [130, 42], [127, 35], [122, 40], [121, 32], [120, 25], [108, 21], [106, 10], [100, 13], [104, 2], [98, 8], [97, 17], [92, 22], [88, 22], [80, 15], [77, 8], [73, 17], [68, 24], [57, 25], [56, 27], [50, 30], [48, 29], [52, 24], [56, 24], [59, 22], [52, 16], [43, 13], [35, 28], [34, 31], [36, 36], [27, 37], [26, 40], [23, 38], [19, 41], [14, 45], [18, 40], [16, 38], [12, 42], [8, 44], [3, 43], [-2, 37]],
        [[-17, 21], [-16, 28], [-10, 35], [10, 37], [20, 32], [32, 31], [35, 28], [43, 12], [51, 12], [41, -2], [40, -15], [35, -24], [32, -29], [25, -34], [18, -34], [12, -18], [13, -6], [9, 4], [-8, 4], [-15, 11]],
        [[114, -22], [122, -18], [131, -12], [137, -12], [142, -11], [146, -19], [153, -26], [150, -37], [141, -38], [135, -34], [124, -33], [115, -34]],
        [[-180, -71], [-150, -76], [-100, -72], [-60, -65], [-45, -78], [0, -70], [60, -67], [110, -66], [160, -70], [180, -72], [180, -90], [-180, -90]],
        [[-6, 50], [-3, 58], [-6, 56], [-10, 52]],
        [[130, 31], [141, 38], [142, 45], [137, 36]],
        [[95, 5], [106, -6], [101, -3]],
        [[106, -6], [115, -8], [108, -8]],
        [[110, 2], [118, 7], [119, 0], [114, -4], [110, -2]],
        [[44, -25], [50, -15], [48, -13], [43, -22]],
        [[166, -46], [174, -41], [178, -38], [172, -35], [168, -44]]
      ];

      // Máscara de terra por resolução. "low" usa os polígonos acima (sem rede);
      // "high" carrega o Natural Earth (world-atlas) sob demanda e rasteriza uma vez.
      var RES = {
        low: { w: 1024, label: "Continentes simplificados (baixa resolução)", buf: 520 },
        high: { w: 4096, url: "https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json", label: "Natural Earth 1:50m (alta resolução)", buf: 800 }
      };
      var masks = {}, loading = {};
      var MW = 1024, MH = 512, land, bufMax = 520, resMode = "low";

      function rasterize(width, drawPolys) {
        var h2 = width / 2, c = document.createElement("canvas");
        c.width = width; c.height = h2;
        var m = c.getContext("2d");
        m.fillStyle = "#000"; m.fillRect(0, 0, width, h2);
        m.fillStyle = "#fff";
        drawPolys(m, function (p) { return [(p[0] + 180) / 360 * width, (90 - p[1]) / 180 * h2]; });
        var d = m.getImageData(0, 0, width, h2).data, out = new Uint8Array(width * h2);
        for (var i = 0; i < out.length; i++) out[i] = d[i * 4];
        return { w: width, h: h2, data: out };
      }

      masks.low = rasterize(1024, function (m, pt) {
        LAND.forEach(function (poly) {
          m.beginPath();
          poly.forEach(function (p, i) { var q = pt(p); if (i) m.lineTo(q[0], q[1]); else m.moveTo(q[0], q[1]); });
          m.closePath(); m.fill();
        });
      });

      function topoPolygons(topo) {
        var tr = topo.transform, arcs = topo.arcs.map(function (arc) {
          var x = 0, y = 0;
          return arc.map(function (p) {
            x += p[0]; y += p[1];
            return tr ? [x * tr.scale[0] + tr.translate[0], y * tr.scale[1] + tr.translate[1]] : [x, y];
          });
        });
        function ring(ids) {
          var pts = [];
          ids.forEach(function (id) {
            var a = id < 0 ? arcs[~id].slice().reverse() : arcs[id];
            pts = pts.concat(pts.length ? a.slice(1) : a);
          });
          // longitudes contínuas através do antimeridiano (evita linhas horizontais na máscara)
          var off = 0;
          return pts.map(function (p, i) {
            if (i) {
              var d = p[0] - pts[i - 1][0];
              if (d > 180) off -= 360; else if (d < -180) off += 360;
            }
            return [p[0] + off, p[1]];
          });
        }
        var polys = [];
        function geom(g) {
          if (g.type === "GeometryCollection") g.geometries.forEach(geom);
          else if (g.type === "Polygon") polys.push(g.arcs.map(ring));
          else if (g.type === "MultiPolygon") g.arcs.forEach(function (p) { polys.push(p.map(ring)); });
        }
        Object.keys(topo.objects).forEach(function (k) { geom(topo.objects[k]); });
        return polys;
      }

      function applyMask(mode) {
        var m = masks[mode];
        land = m.data; MW = m.w; MH = m.h; bufMax = RES[mode].buf; resMode = mode;
        document.getElementById("resinfo").textContent = RES[mode].label;
        Array.prototype.forEach.call(document.querySelectorAll(".res"), function (b) {
          b.classList.toggle("active", b.dataset.res === mode);
        });
      }

      function setRes(mode) {
        if (masks[mode]) return applyMask(mode);
        if (loading[mode]) return;
        var info = document.getElementById("resinfo"), btn = document.querySelector('.res[data-res="' + mode + '"]');
        loading[mode] = true; btn.disabled = true; info.textContent = "Carregando dados…";
        fetch(RES[mode].url).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (topo) {
          var polys = topoPolygons(topo);
          masks[mode] = rasterize(RES[mode].w, function (m, pt) {
            polys.forEach(function (rings) {
              [-360, 0, 360].forEach(function (shift) {
                m.beginPath();
                rings.forEach(function (r) {
                  r.forEach(function (p, i) { var q = pt([p[0] + shift, p[1]]); if (i) m.lineTo(q[0], q[1]); else m.moveTo(q[0], q[1]); });
                  m.closePath();
                });
                m.fill("evenodd");
              });
            });
            // o anel do polo sul no dado anula a calota sob evenodd; tudo ao sul de -84° é terra
            var top = pt([0, -84])[1];
            m.fillRect(0, top, RES[mode].w, RES[mode].w / 2 - top);
          });
          applyMask(mode);
        }).catch(function () {
          info.textContent = "Falha ao carregar; mantendo " + RES[resMode].label.toLowerCase();
        }).then(function () { loading[mode] = false; btn.disabled = false; });
      }
      Array.prototype.forEach.call(document.querySelectorAll(".res"), function (b) {
        b.onclick = function () { setRes(b.dataset.res); };
      });
      applyMask("low");
      setRes("high");

      // Textura real (NASA Blue Marble) para a cor da terra; sem ela, usa biomeColor
      var tex = null, TW = 2048, TH = 1024;
      (function () {
        var im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = function () {
          var c = document.createElement("canvas");
          c.width = TW; c.height = TH;
          var t = c.getContext("2d");
          t.imageSmoothingQuality = "high";
          t.drawImage(im, 0, 0, TW, TH);
          tex = t.getImageData(0, 0, TW, TH).data;
          RES.high.label = "Natural Earth 1:50m + NASA Blue Marble (alta resolução)";
          if (resMode === "high") document.getElementById("resinfo").textContent = RES.high.label;
        };
        im.src = "https://cdn.jsdelivr.net/npm/three-globe@2/example/img/earth-blue-marble.jpg";
      })();

      var stars = [];
      for (var i = 0; i < 180; i++) stars.push([Math.random(), Math.random(), Math.random() * 1.2 + .3, Math.random() * .6 + .3]);

      var buf = document.createElement("canvas");
      var bctx = buf.getContext("2d");

      var DEF = { lon: 0, lat: 20, zoom: 1 };
      var lon = DEF.lon, lat = DEF.lat, zoom = DEF.zoom;
      var vLon = 0.05, vLat = 0;
      var spinning = true, dragging = false;
      var w = 0, h = 0, dpr = 1;
      var pointers = {}, pinchDist = 0, lastTap = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      }
      window.addEventListener("resize", resize);
      resize();

      function clampZoom() { zoom = Math.max(.5, Math.min(zoom, 4)); }
      function clampLat() { lat = Math.max(-85, Math.min(85, lat)); }

      function sens() { return 0.25 / zoom * (Math.min(w, h) < 600 ? 1.1 : 1); }

      canvas.addEventListener("pointerdown", function (e) {
        canvas.setPointerCapture(e.pointerId);
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        dragging = true; canvas.classList.add("dragging");
        vLon = vLat = 0;
        var ids = Object.keys(pointers);
        if (ids.length === 2) pinchDist = dist();
        var now = Date.now();
        if (ids.length === 1) { if (now - lastTap < 300) reset(); lastTap = now; }
      });
      function dist() {
        var k = Object.keys(pointers), a = pointers[k[0]], b = pointers[k[1]];
        return Math.hypot(a.x - b.x, a.y - b.y);
      }
      canvas.addEventListener("pointermove", function (e) {
        var p = pointers[e.pointerId];
        if (!p) return;
        var n = Object.keys(pointers).length;
        if (n === 1) {
          var dx = e.clientX - p.x, dy = e.clientY - p.y;
          lon -= dx * sens(); lat += dy * sens(); clampLat();
          vLon = -dx * sens(); vLat = dy * sens();
        }
        p.x = e.clientX; p.y = e.clientY;
        if (n === 2) {
          var d = dist();
          if (pinchDist > 0) { zoom *= d / pinchDist; clampZoom(); }
          pinchDist = d;
        }
      });
      function up(e) {
        delete pointers[e.pointerId];
        pinchDist = 0;
        if (!Object.keys(pointers).length) { dragging = false; canvas.classList.remove("dragging"); }
      }
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        zoom *= Math.exp(-e.deltaY * 0.0015); clampZoom();
      }, { passive: false });
      canvas.addEventListener("dblclick", reset);
      canvas.addEventListener("keydown", function () { });

      function reset() { lon = DEF.lon; lat = DEF.lat; zoom = DEF.zoom; vLon = vLat = 0; }
      document.getElementById("reset").onclick = reset;
      document.getElementById("zin").onclick = function () { zoom *= 1.25; clampZoom(); };
      document.getElementById("zout").onclick = function () { zoom /= 1.25; clampZoom(); };
      var spinBtn = document.getElementById("spin");
      spinBtn.onclick = function () {
        spinning = !spinning;
        spinBtn.textContent = "Rotação: " + (spinning ? "ligada" : "desligada");
      };

      function sm(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

      // [lat0, lat1, lon0, lon1, cor, suavização]; aplicadas em ordem (a última tem prioridade)
      var BOXES = [
        [30, 50, -110, -90, 0x858f4f, 6], [-40, -25, -65, -55, 0x858f4f, 4], [40, 55, 35, 80, 0x858f4f, 6],
        [-20, 15, 15, 35, 0x97974c, 6],
        [-15, 8, -80, -45, 0x276f3b, 6], [-10, 5, 10, 30, 0x276f3b, 5], [-10, 20, 95, 150, 0x276f3b, 6], [5, 20, -100, -75, 0x276f3b, 4],
        [15, 33, -17, 35, 0xc29d63, 6], [12, 32, 35, 60, 0xc29d63, 6], [-30, -15, 10, 30, 0xc29d63, 5], [-30, -15, -80, -68, 0xc29d63, 3],
        [-32, -18, 120, 145, 0xc29d63, 5], [25, 38, -120, -105, 0xc29d63, 4], [37, 48, 85, 115, 0xc29d63, 5], [35, 48, 45, 80, 0xc29d63, 5],
        [60, 84, -74, -11, 0xe8eeef, 8], [27, 36, 85, 95, 0xe8eeef, 3], [-36, -15, -72, -68, 0xe8eeef, 2]
      ];
      var BASE = [[15, 40, 0x65844c], [48, 60, 0x416c4d], [64, 72, 0x7f8a76], [72, 82, 0xe8eeef]];

      function mixc(c, t, c2) {
        var r = c[0], g = c[1], b = c[2];
        c[0] = r + (((c2 >> 16) & 255) - r) * t; c[1] = g + (((c2 >> 8) & 255) - g) * t; c[2] = b + ((c2 & 255) - b) * t;
      }

      // Cores de bioma por mistura suave, sem bordas retas em lat/lon (que viravam anéis nos polos)
      function biomeColor(latitude, longitude) {
        var a = Math.abs(latitude), c = [0x58, 0x85, 0x45], i, k, t;
        for (i = 0; i < BASE.length; i++) mixc(c, sm(BASE[i][0], BASE[i][1], a), BASE[i][2]);
        for (i = 0; i < BOXES.length; i++) {
          k = BOXES[i];
          t = sm(k[0], k[0] + k[5], latitude) * sm(k[1], k[1] - k[5], latitude) *
            sm(k[2], k[2] + k[5], longitude) * sm(k[3], k[3] - k[5], longitude);
          if (t > 0) mixc(c, t, k[4]);
        }
        return (Math.round(c[0]) << 16) | (Math.round(c[1]) << 8) | Math.round(c[2]);
      }

      function draw() {
        if (!dragging) {
          lon += vLon; lat += vLat; clampLat();
          vLon *= 0.95; vLat *= 0.95;
          if (spinning && Math.abs(vLon) < 0.05) lon += 0.08;
        }
        lon = ((lon + 540) % 360) - 180;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#02040b"; ctx.fillRect(0, 0, w, h);
        stars.forEach(function (s) {
          ctx.fillStyle = "rgba(255,255,255," + s[3] + ")";
          ctx.fillRect(s[0] * w, s[1] * h, s[2], s[2]);
        });

        var R = Math.min(w, h) * 0.38 * zoom;
        var cx = w / 2, cy = h / 2;

        // atmosfera
        var g = ctx.createRadialGradient(cx, cy, R * 0.98, cx, cy, R * 1.18);
        g.addColorStop(0, "rgba(90,170,255,.45)"); g.addColorStop(1, "rgba(90,170,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.18, 0, 7); ctx.fill();

        // renderiza esfera por pixel em buffer de resolução reduzida
        var size = Math.max(64, Math.min(Math.ceil(R * 2), bufMax));
        if (buf.width !== size) { buf.width = buf.height = size; }
        var img = bctx.createImageData(size, size), px = img.data;
        var cl = Math.cos(lat * D), sl = Math.sin(lat * D), lo0 = lon * D;
        // luz vinda do canto superior esquerdo-frente
        var lx = -0.45, ly = 0.4, lz = 0.8, ln = Math.hypot(lx, ly, lz);
        lx /= ln; ly /= ln; lz /= ln;
        for (var j = 0; j < size; j++) {
          var y = 1 - 2 * (j + .5) / size;
          for (var i2 = 0; i2 < size; i2++) {
            var x = 2 * (i2 + .5) / size - 1;
            var r2 = x * x + y * y;
            if (r2 > 1) continue;
            var z = Math.sqrt(1 - r2);
            // rotaciona do referencial da câmera para o do globo
            var y1 = y * cl + z * sl, z1 = z * cl - y * sl;
            var la = Math.asin(y1), lo = Math.atan2(x, z1) + lo0;
            var u = ((lo / D + 180) % 360 + 360) % 360 / 360, v = (90 - la / D) / 180;
            var mi = ((Math.min(MH - 1, (v * MH) | 0)) * MW + ((u * MW) | 0)) * 4;
            var isLand = land[mi >> 2] > 128, rr, gg, bb;
            if (isLand) {
              if (tex && resMode === "high") {
                var ti = (Math.min(TH - 1, (v * TH) | 0) * TW + Math.min(TW - 1, (u * TW) | 0)) * 4;
                rr = tex[ti]; gg = tex[ti + 1]; bb = tex[ti + 2];
              } else {
                var biome = biomeColor(la / D, ((lo / D + 540) % 360) - 180);
                rr = (biome >> 16) & 255; gg = (biome >> 8) & 255; bb = biome & 255;
              }
            } else {
              rr = 14; gg = 60; bb = 130;
            }
            var dif = Math.max(0, x * lx + y * ly + z * lz);
            var shade = 0.18 + 0.82 * dif;
            var spec = !isLand ? Math.pow(Math.max(0, 2 * dif * z - lz), 24) * 90 : 0;
            var rim = Math.pow(1 - z, 3) * 70 * (0.3 + dif);
            var k = (j * size + i2) * 4;
            px[k] = Math.min(255, rr * shade + spec + rim * .5);
            px[k + 1] = Math.min(255, gg * shade + spec + rim * .8);
            px[k + 2] = Math.min(255, bb * shade + spec + rim);
            px[k + 3] = 255;
          }
        }
        bctx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
        ctx.drawImage(buf, cx - R, cy - R, R * 2, R * 2);
        ctx.restore();
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
