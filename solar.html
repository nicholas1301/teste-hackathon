<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="theme-color" content="#02040b">
    <title>Sistema Solar 3D — Hackathon</title>
    <style>
      :root { color-scheme: dark; --accent: #7fd6ff; --text: #eef2ff; --muted: #9aa6c7; --line: rgba(238,242,255,.14); }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; background: #02040b; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      html.embedded .bar { display: none; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; display: block; }
      #scene.dragging { cursor: grabbing; }
      .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; pointer-events: none; }
      .bar > * { pointer-events: auto; }
      .back { padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(14,20,40,.8); backdrop-filter: blur(10px); font-size: 13px; color: var(--text); text-decoration: none; }
      .back:hover { border-color: var(--accent); }
      h1 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
      h1 span { color: var(--accent); }
      .panel { position: fixed; z-index: 2; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(14,20,40,.82); backdrop-filter: blur(10px); font-size: 12px; color: var(--muted); max-width: calc(100% - 40px); }
      .panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
      .panel b { color: var(--text); font-weight: 650; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { font: inherit; padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; }
      button:hover { border-color: var(--accent); }
      #info { position: fixed; z-index: 2; right: 20px; bottom: 20px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(14,20,40,.82); font-size: 12px; color: var(--muted); min-width: 150px; }
      #info strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
      @media (max-width: 640px) { .panel ul { display: none; } #info { bottom: auto; top: 64px; right: 20px; } }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).has("embed")) document.documentElement.classList.add("embedded");
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="Visualizador 3D do Sistema Solar"></canvas>
    <header class="bar">
      <a class="back" href="index.html">← Voltar</a>
      <h1>SISTEMA SOLAR<span>.</span>3D</h1>
      <span></span>
    </header>
    <div class="panel">
      <ul>
        <li><b>Arraste</b> para girar a visão</li>
        <li><b>Scroll</b> (ou pinça no celular) para zoom</li>
        <li><b>Clique</b> num planeta para focar nele</li>
        <li><b>Duplo clique</b> no vazio para redefinir</li>
      </ul>
      <div class="row">
        <button id="pause" type="button">⏸ Pausar</button>
        <button id="orbits" type="button">Órbitas: ligadas</button>
        <button id="reset" type="button">Redefinir</button>
      </div>
    </div>
    <div id="info"><strong>Sistema Solar</strong>Excentricidades baixas ampliadas para visualização</div>
    <script>
      (function () {
        var canvas = document.getElementById("scene");
        var ctx = canvas.getContext("2d");
        var info = document.getElementById("info");
        var TAU = Math.PI * 2;

        // r: raio da órbita (escala comprimida), s: tamanho, p: período em anos
        var bodies = [
          { n: "Mercúrio", r: 70,  e: 0.206, s: 3.2, p: 0.24, c: "#b5a99a", d: "Órbita: 88 dias" },
          { n: "Vênus",    r: 105, e: 0.007, s: 5.6, p: 0.62, c: "#e8c98a", d: "Órbita: 225 dias" },
          { n: "Terra",    r: 145, e: 0.017, s: 6,   p: 1,    c: "#4f9dff", d: "Órbita: 365 dias" },
          { n: "Marte",    r: 185, e: 0.093, s: 4.3, p: 1.88, c: "#e0633f", d: "Órbita: 687 dias" },
          { n: "Júpiter",  r: 270, e: 0.049, s: 15,  p: 11.9, c: "#d9a877", d: "Órbita: 11,9 anos" },
          { n: "Saturno",  r: 345, e: 0.057, s: 12.5,p: 29.5, c: "#e6d29b", d: "Órbita: 29,5 anos", ring: true },
          { n: "Urano",    r: 415, e: 0.046, s: 8.5, p: 84,   c: "#8fe3e8", d: "Órbita: 84 anos" },
          { n: "Netuno",   r: 475, e: 0.010, s: 8.2, p: 165,  c: "#4466e8", d: "Órbita: 165 anos" }
        ];
        var sun = { n: "Sol", s: 30, c: "#ffc861", d: "Estrela central", sun: true, x: 0, y: 0, z: 0 };
        bodies.forEach(function (b, i) { b.visualE = Math.max(b.e, 0.04); b.a = i * 1.7; b.x = b.y = b.z = 0; });

        var HOME = { yaw: 0.6, pitch: 0.45, dist: 900 };
        var cam = { yaw: HOME.yaw, pitch: HOME.pitch, dist: HOME.dist };
        var tgt = { yaw: HOME.yaw, pitch: HOME.pitch, dist: HOME.dist };
        var focus = null, fx = 0, fy = 0, fz = 0;
        var paused = false, showOrbits = true, w, h, dpr, F, hover = null;

        var stars = [];
        for (var i = 0; i < 400; i++) {
          var u = Math.random() * TAU, v = Math.acos(2 * Math.random() - 1);
          stars.push([Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u), Math.random()]);
        }

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth; h = window.innerHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          F = Math.min(w, h) * 0.9;
        }

        var cy, sy, cp, sp;
        function project(x, y, z) {
          x -= fx; y -= fy; z -= fz;
          var x1 = x * cy - z * sy, z1 = x * sy + z * cy;
          var y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
          var depth = cam.dist - z2;
          if (depth < 8) return null;
          var k = F / depth;
          return { x: w / 2 + x1 * k, y: h / 2 - y1 * k, k: k, d: depth };
        }

        function drawStars() {
          ctx.fillStyle = "#eef2ff";
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var x1 = s[0] * cy - s[2] * sy, z1 = s[0] * sy + s[2] * cy;
            var y1 = s[1] * cp - z1 * sp, z2 = s[1] * sp + z1 * cp;
            if (z2 > 0.2) continue;
            ctx.globalAlpha = 0.35 + s[3] * 0.6;
            ctx.fillRect(w / 2 + x1 * F * 1.6, h / 2 - y1 * F * 1.6, 1.4, 1.4);
          }
          ctx.globalAlpha = 1;
        }

        function drawOrbit(r, e, color) {
          ctx.beginPath();
          var started = false;
          for (var i = 0; i <= 120; i++) {
            var a = i / 120 * TAU, p = project((Math.cos(a) - e) * r, 0, Math.sin(a) * r * Math.sqrt(1 - e * e));
            if (!p) { started = false; continue; }
            if (started) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); started = true; }
          }
          ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
        }

        function drawRing(b, p, front) {
          var bands = [[1.45,1.65,"rgba(200,180,140,.35)"],[1.65,1.95,"rgba(238,222,176,.85)"],[1.95,2.0,"rgba(20,24,40,.0)"],[2.0,2.3,"rgba(215,194,146,.7)"]];
          var N = 96;
          for (var k = 0; k < bands.length; k++) {
            var ri = b.s * bands[k][0], ro = b.s * bands[k][1];
            ctx.fillStyle = bands[k][2];
            for (var i = 0; i < N; i++) {
              var a0 = i / N * TAU, a1 = (i + 1.5) / N * TAU, am = (a0 + a1) / 2;
              var depth = Math.cos(am) * sy + Math.sin(am) * cy;
              if ((depth > 0) !== front) continue;
              var q1 = project(b.x + Math.cos(a0) * ro, b.y, b.z + Math.sin(a0) * ro),
                  q2 = project(b.x + Math.cos(a1) * ro, b.y, b.z + Math.sin(a1) * ro),
                  q3 = project(b.x + Math.cos(a1) * ri, b.y, b.z + Math.sin(a1) * ri),
                  q4 = project(b.x + Math.cos(a0) * ri, b.y, b.z + Math.sin(a0) * ri);
              if (!q1 || !q2 || !q3 || !q4) continue;
              ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.lineTo(q4.x, q4.y); ctx.closePath(); ctx.fill();
            }
          }
        }

        function drawBody(b) {
          var p = b.p2; if (!p) return;
          var r = Math.max(b.s * p.k, 1.5);
          if (b.sun) {
            var g = ctx.createRadialGradient(p.x, p.y, r * 0.3, p.x, p.y, r * 3.2);
            g.addColorStop(0, "rgba(255,200,97,.55)"); g.addColorStop(1, "rgba(255,160,60,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.2, 0, TAU); ctx.fill();
            g = ctx.createRadialGradient(p.x - r * .2, p.y - r * .2, r * .1, p.x, p.y, r);
            g.addColorStop(0, "#fff6d0"); g.addColorStop(.5, "#ffc861"); g.addColorStop(1, "#ff8a2b");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
          } else {
            if (b.ring) drawRing(b, p, false);
            // luz vinda do Sol: deslocar o brilho em direção ao Sol na tela
            var sp0 = sun.p2, dx = 0, dy = 0;
            if (sp0) { var l = Math.hypot(sp0.x - p.x, sp0.y - p.y) || 1; dx = (sp0.x - p.x) / l; dy = (sp0.y - p.y) / l; }
            var g2 = ctx.createRadialGradient(p.x + dx * r * .45, p.y + dy * r * .45, r * .1, p.x, p.y, r * 1.05);
            g2.addColorStop(0, b.c); g2.addColorStop(1, "#05070f");
            ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
            if (b.ring) drawRing(b, p, true);
          }
          if (b === hover || b === focus) {
            ctx.strokeStyle = "rgba(127,214,255,.8)"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, TAU); ctx.stroke();
          }
          if (r > 2 || b === hover || b === focus || showOrbits) {
            ctx.fillStyle = b === hover || b === focus ? "#fff" : "rgba(238,242,255,.65)";
            ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "center";
            ctx.fillText(b.n, p.x, p.y + r + 15);
          }
        }

        var last = performance.now();
        function frame(t) {
          var dt = Math.min((t - last) / 1000, 0.1); last = t;
          var ease = 1 - Math.pow(0.001, dt);
          cam.yaw += (tgt.yaw - cam.yaw) * ease;
          cam.pitch += (tgt.pitch - cam.pitch) * ease;
          cam.dist += (tgt.dist - cam.dist) * ease;
          if (!paused) bodies.forEach(function (b) { b.a += dt * TAU / (b.p * 8 + 4) * (1 / Math.sqrt(b.p + .3)) * 0.6; });
          bodies.forEach(function (b) { b.x = (Math.cos(b.a) - b.visualE) * b.r; b.z = Math.sin(b.a) * b.r * Math.sqrt(1 - b.visualE * b.visualE); });
          var ft = focus || { x: 0, y: 0, z: 0 };
          fx += (ft.x - fx) * ease; fy += (ft.y - fy) * ease; fz += (ft.z - fz) * ease;

          cy = Math.cos(cam.yaw); sy = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
          ctx.fillStyle = "#02040b"; ctx.fillRect(0, 0, w, h);
          drawStars();
          if (showOrbits) {
            ctx.setLineDash([]);
            bodies.forEach(function (b) { drawOrbit(b.r, b.visualE, b === focus ? "rgba(127,214,255,.45)" : "rgba(238,242,255,.14)"); });
          }
          var all = bodies.concat([sun]);
          all.forEach(function (b) { b.p2 = project(b.x, b.y, b.z); });
          all.slice().filter(function (b) { return b.p2; }).sort(function (a, b) { return b.p2.d - a.p2.d; }).forEach(drawBody);
          requestAnimationFrame(frame);
        }

        function pick(mx, my) {
          var best = null, bd = 1e9;
          bodies.concat([sun]).forEach(function (b) {
            if (!b.p2) return;
            var r = Math.max(b.s * b.p2.k, 1.5) + 8, d = Math.hypot(mx - b.p2.x, my - b.p2.y);
            if (d < r && b.p2.d < bd) { best = b; bd = b.p2.d; }
          });
          return best;
        }

        function setInfo(b) {
          info.innerHTML = b ? "<strong>" + b.n + "</strong>" + b.d : "<strong>Sistema Solar</strong>Excentricidades baixas ampliadas para visualização";
        }

        function clampTgt() {
          tgt.pitch = Math.max(-1.5, Math.min(1.5, tgt.pitch));
          tgt.dist = Math.max(120, Math.min(2200, tgt.dist));
        }

        // Ponteiros (mouse + toque, com pinça)
        var ptrs = {}, moved = 0, pinch0 = 0;
        canvas.addEventListener("pointerdown", function (e) {
          canvas.setPointerCapture(e.pointerId);
          ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
          moved = 0; canvas.classList.add("dragging");
          var ids = Object.keys(ptrs);
          if (ids.length === 2) pinch0 = Math.hypot(ptrs[ids[0]].x - ptrs[ids[1]].x, ptrs[ids[0]].y - ptrs[ids[1]].y);
        });
        canvas.addEventListener("pointermove", function (e) {
          var p = ptrs[e.pointerId];
          if (!p) { hover = pick(e.clientX, e.clientY); canvas.style.cursor = hover ? "pointer" : ""; setInfo(hover || focus); return; }
          var ids = Object.keys(ptrs);
          if (ids.length === 2) {
            ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
            var d = Math.hypot(ptrs[ids[0]].x - ptrs[ids[1]].x, ptrs[ids[0]].y - ptrs[ids[1]].y);
            if (pinch0) { tgt.dist *= pinch0 / d; clampTgt(); }
            pinch0 = d; moved += 10; return;
          }
          var dx = e.clientX - p.x, dy = e.clientY - p.y;
          moved += Math.abs(dx) + Math.abs(dy);
          tgt.yaw += dx * 0.006; tgt.pitch += dy * 0.006; clampTgt();
          cam.yaw = tgt.yaw; cam.pitch = tgt.pitch;
          p.x = e.clientX; p.y = e.clientY;
        });
        function up(e) {
          if (!ptrs[e.pointerId]) return;
          delete ptrs[e.pointerId]; pinch0 = 0;
          if (!Object.keys(ptrs).length) canvas.classList.remove("dragging");
          if (e.type === "pointerup" && moved < 6) {
            var b = pick(e.clientX, e.clientY);
            if (b) { focus = b.sun ? null : b; setInfo(b); tgt.dist = Math.max(120, b.sun ? 700 : b.s * 14 + 80); }
          }
        }
        canvas.addEventListener("pointerup", up);
        canvas.addEventListener("pointercancel", up);
        canvas.addEventListener("wheel", function (e) {
          e.preventDefault();
          tgt.dist *= Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015)); clampTgt();
        }, { passive: false });
        function reset() { focus = null; tgt.yaw = HOME.yaw; tgt.pitch = HOME.pitch; tgt.dist = HOME.dist; setInfo(null); }
        canvas.addEventListener("dblclick", function (e) { if (!pick(e.clientX, e.clientY)) reset(); });
        document.getElementById("reset").onclick = reset;
        document.getElementById("pause").onclick = function () { paused = !paused; this.textContent = paused ? "▶ Continuar" : "⏸ Pausar"; };
        document.getElementById("orbits").onclick = function () { showOrbits = !showOrbits; this.textContent = "Órbitas: " + (showOrbits ? "ligadas" : "desligadas"); };
        window.addEventListener("resize", resize);

        resize();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
