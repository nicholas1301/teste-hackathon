<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070d">
    <title>Simuladores 3D</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        background: #05070d;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(420px, 100%);
        min-height: 88px;
        border-radius: 16px;
        background: #12182a;
        border: 1px solid #2d3a5c;
        color: #fff;
        font-size: 1.4rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover, a:focus-visible { background: #1b2540; border-color: #5b7cc9; outline: none; }
    </style>
  </head>
  <body>
    <a href="terra.html">🌍 Simulador da Terra</a>
    <a href="solar.html">☀️ Simulador do Sistema Solar</a>
  </body>
</html>
